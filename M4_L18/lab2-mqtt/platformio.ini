; Lesson 18 - Lab 2: AHT10 + WiFi + web server + MQTT
; ESP32-C3 Super Mini and Lolin S2 Mini, Arduino-ESP32 core 2.x.
;
; "platformio/espressif32" (with the owner) is on purpose: if pioarduino
; (core 3.x) is also installed, plain "espressif32" may resolve to it.
;
; Before the first build: copy include/secrets.example.h to
; include/secrets.h and fill it in. secrets.h is never committed.

[env]
platform = platformio/espressif32
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    adafruit/Adafruit AHTX0
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8

[env:c3]
board = lolin_c3_mini

[env:s2]
board = lolin_s2_mini
