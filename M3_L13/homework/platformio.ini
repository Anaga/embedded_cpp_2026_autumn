; Lesson 12 homework - one Pico, two UARTs
; Raspberry Pi Pico (RP2040), Arduino-Pico core
;
; Uncomment ONLY your own src_dir line below.
; Do not commit your change to this file - commit only your own folder.

[platformio]
;extra_configs = sven/src/platformio.ini
;src_dir = sven
; src_dir = viktorija/src
src_dir = anton/src
; src_dir = vahur/src

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit AHTX0
