[platformio]
default_envs = lolin_c3_mini

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = 
    -std=gnu++11
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv
lib_deps = 
    arduinojson