; Anti-Murzik (Диванный страж) - PlatformIO project
; ESP32-based mobile robot for furniture protection

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    ; Web server
    https://github.com/me-no-dev/ESPAsyncWebServer
    ; WiFi management
    https://github.com/tzapu/WiFiManager
    ; Non-blocking delays and timers
    ; ArduinoJson for JSON responses
    arduinojson
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -Wall
    -Wextra
monitor_filters = esp32_exception_decoder

[env:esp32dev-debug]
extends = env:esp32dev
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -DDEBUG
    -Wall
    -Wextra
    -Og

[platformio]
src_dir = src
lib_deps = 
    https://github.com/me-no-dev/ESPAsyncWebServer
    arduinojson
