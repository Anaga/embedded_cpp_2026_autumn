[platformio]
default_envs = freenove_esp32_wrover

[env:freenove_esp32_wrover]
platform = espressif32@7.1.3
board = freenove_esp32_wrover
framework = arduino
upload_protocol = esptool
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DUSE_AUDIO_LOGGING=false
    ; Compatibility with the Arduino 2.0.17 / IDF 4.4 framework.
    -DESP_A2D_AUDIO_STATE_SUSPEND=ESP_A2D_AUDIO_STATE_REMOTE_SUSPEND
lib_deps =
    ; AudioTools 1.2.6 and ESP32-A2DP 1.8.11, pinned to release commits.
    https://github.com/pschatzmann/arduino-audio-tools.git#b3ff639e952456a7ccf076cfb533db12c46e4d18
    https://github.com/pschatzmann/ESP32-A2DP.git#b6da4744286ca15b6f1dee607c077a4747294dd4
