; PISI / ESP32-C3 Super Mini, PlatformIO project
; For the older Arduino-ESP32 2.x LEDC API used in the user's Taimer code.
[env:lolin_c3_mini]
platform = espressif32@6.10.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit AHTX0
