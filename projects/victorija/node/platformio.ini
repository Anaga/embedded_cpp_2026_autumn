[env:node]
platform = platformio/espressif32@^6.9.0  ; Arduino core 2.x
board = lolin_c3_mini
board_build.flash_mode = dio  ; many C3 Super Mini clones don't boot with qio
framework = arduino
monitor_speed = 115200
lib_deps = sandeepmistry/LoRa@^0.8.0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -D BOARD_C3 -I ../common
