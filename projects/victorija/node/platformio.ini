; Winter Guardian - the NODE (under the seat): ESP32-C3 Super Mini + Ra-01 module 1 + sensors.
; Wakes every 20 s (or on movement), measures, sends one GuardianMsg over LoRa, deep sleeps.
;
;   pio run                 build (no board needed)
;   pio run -t upload       flash the C3
;   pio device monitor      watch it (Ctrl+C to quit)

[env:node]
; espressif32 6.x = Arduino core 2.x, pinned on purpose (core 3.x changed several APIs)
platform = platformio/espressif32@^6.9.0
board = lolin_c3_mini
; Many C3 Super Mini clones don't boot with the board file's "qio" flash mode. "dio" works on all of them.
board_build.flash_mode = dio
framework = arduino
monitor_speed = 115200
lib_deps = sandeepmistry/LoRa@^0.8.0
build_unflags = -std=gnu++11
; -I ../common: msg.h and radio.h, shared with the gateway
build_flags = -std=gnu++17 -D BOARD_C3 -I ../common
; the C3's own USB -> /dev/cu.usbmodemXXXX (so the S3 can stay plugged in too)
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
