; Winter Guardian - the GATEWAY (by the window): ESP32-S3-DevKitC-1U board A + Ra-01 module 2.
; Receives GuardianMsg packets, raises alarms, reports to a Telegram bot.
; Fill in include/secrets.h first (copy secrets.h.example).
;
; Cable in the port labelled UART.
;   pio run                 build (no board needed)
;   pio run -t upload       flash the S3
;   pio device monitor      watch it (Ctrl+C to quit)

[env:gateway]
; espressif32 6.x = Arduino core 2.x, pinned on purpose (core 3.x changed several APIs)
platform = platformio/espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; lesson 24: see what you type, send the line on Enter (wifi add ...)
monitor_echo = yes
monitor_filters = send_on_enter
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  witnessmenow/UniversalTelegramBot@^1.3.0
  bblanchon/ArduinoJson@^6.21.5
build_unflags = -std=gnu++11
; -I ../common: msg.h and radio.h, shared with the node
build_flags = -std=gnu++17 -D BOARD_S3 -I ../common
; the S3's UART port goes through the CP2102 chip -> /dev/cu.usbserial-XXXX (so the C3 can stay plugged in too)
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*
