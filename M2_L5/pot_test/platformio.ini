; Lesson 05 - potentiometer calibration probe
; Instructor tool. Not part of the student package.

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

; The Super Mini has no USB-UART bridge. Serial goes over native USB CDC,
; so these two flags must be set or the monitor stays empty.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

build_unflags =
    -std=gnu++11
