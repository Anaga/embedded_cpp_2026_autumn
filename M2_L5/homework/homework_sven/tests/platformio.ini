; Independent Google Test project for the host computer.
; From homework: pio test -d homework_sven/tests -e native
[env:native]
platform = native@1.2.1
test_framework = googletest
test_filter = test_temperature
test_build_src = no
lib_deps =
    google/googletest@1.17.0
build_flags =
    -std=c++17
    -Itest/support
