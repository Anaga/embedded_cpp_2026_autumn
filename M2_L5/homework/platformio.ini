; Lesson 05 - homework
; Temperature conversion on the ESP32-C3 Super Mini.

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

;Student Homework location
[platformio]
;src_dir = src
src_dir = homework_sven/src
;src_dir = homework_viktorija/src
;src_dir = homework_anton/src
;src_dir = homework_vahur/src

; The Super Mini has no USB-UART bridge. Serial runs over native USB CDC,
; so these two flags must be present or the monitor stays empty.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

build_unflags =
    -std=gnu++11
