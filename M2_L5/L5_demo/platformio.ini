; Lesson 05 - instructor demo
; Variables, types and arithmetic on the ESP32-C3 Super Mini.

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

; The Super Mini has no USB-UART bridge. Serial runs over native USB CDC,
; so these two flags must be present or the monitor stays empty.
build_flags =
    -std=gnu++17

build_unflags =
    -std=gnu++11
