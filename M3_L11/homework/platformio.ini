; Lesson 11 homework - first build and upload on the Raspberry Pi Pico (RP2040)
;
; Uncomment ONLY your own src_dir line below.
; Do not commit your change to this file - commit only your own folder.

[platformio]
; src_dir = sven/src
; src_dir = viktorija/src
; src_dir = anton/src
; src_dir = vahur/src

[env:pico]
; Arduino-Pico core (Earle Philhower) through Max Gerhardt's platform fork -
; the same toolchain the course uses for the RP2350.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Arduino-Pico already compiles C++ as gnu++17 - no extra build flags needed.
