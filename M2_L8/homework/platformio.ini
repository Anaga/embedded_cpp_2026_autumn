; Lesson 08 - homework
; Colour wheel on the RGB LED, on the ESP32-C3 Super Mini.

; Student homework location.
; Uncomment exactly one line: your own. Leave the others alone.
[platformio]
src_dir = src
;src_dir = sven/src
;src_dir = viktorija/src
;src_dir = anton/src
;src_dir = vahur/src

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

; The Super Mini has no USB-UART bridge. Serial runs over native USB CDC,
; so these two flags must be present or the monitor stays empty.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

build_unflags =
    -std=gnu++11
