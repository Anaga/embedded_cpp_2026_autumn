; Independent Google Test project for the host computer.
; From the firmware project directory: pio test -d tests -e native
[platformio]
build_dir = build/platformio
libdeps_dir = build/platformio-libdeps

[env:native]
platform = native@1.2.1
test_framework = googletest
test_filter = test_firmware
test_build_src = no
lib_deps =
    google/googletest@1.17.0
build_flags =
    -std=c++17
    -Itest/support
