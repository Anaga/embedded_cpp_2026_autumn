; Lesson 19 - Lab 3 gateway (runs on the instructor's board)
; ESP-NOW receiver + WiFi station + web page, Arduino-ESP32 core 2.x.
;
; Gateway board: Lolin S3 Mini (default) or Lolin S3. A C3 works too.
;   pio run -e s3mini -t upload     Lolin S3 Mini
;   pio run -e s3 -t upload         Lolin S3
;   pio run -e c3 -t upload         ESP32-C3 Super Mini
; Both Lolin S3 boards use the native USB of the chip: Serial is USB CDC.
;
; Before the first build: copy include/secrets.example.h to
; include/secrets.h and fill it in. secrets.h is never committed.

[platformio]
default_envs = s3mini

[env]
platform = platformio/espressif32
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@^7

[env:s3mini]
board = lolin_s2_mini
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1


