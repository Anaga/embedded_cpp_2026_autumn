; Lesson 19 - Lab 1: deep sleep, timer wake and button wake
; ESP32-C3 Super Mini, Arduino-ESP32 core 2.x.
;
; "platformio/espressif32" (with the owner) is on purpose: if pioarduino
; (core 3.x) is also installed, plain "espressif32" may resolve to it.

[env:c3]
platform = platformio/espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
