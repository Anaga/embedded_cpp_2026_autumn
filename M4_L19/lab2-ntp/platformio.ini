; Lesson 19 - Lab 2: NTP once, then deep sleep
; ESP32-C3 Super Mini, Arduino-ESP32 core 2.x.
;
; Before the first build: copy include/secrets.example.h to
; include/secrets.h and fill it in. secrets.h is never committed.

[env:c3]
platform = platformio/espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
