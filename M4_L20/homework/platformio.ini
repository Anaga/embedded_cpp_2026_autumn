; Homework 20 - MQTT thermostat (ESP32-C3 Super Mini)
;
; Uncomment ONLY your own src_dir line below and do not commit this file:
; four different uncommented lines would conflict.
; Your secrets.h lives next to your main.cpp and is ignored by git.

[platformio]
; src_dir = sven/src
; src_dir = viktorija/src
; src_dir = anton/src
; src_dir = vahur/src

[env:c3]
platform = platformio/espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    adafruit/Adafruit AHTX0
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
