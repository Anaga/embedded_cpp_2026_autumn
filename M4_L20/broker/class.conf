# Mosquitto 2.x config for the class network (and for your own laptop at home)
#
# Run:   mosquitto -c class.conf -v
#
# Without a config file Mosquitto 2.x listens on localhost only, and the
# boards cannot reach it. This file opens port 1883 to the network and lets
# clients in without a password.
#
# Only acceptable on a network you control (the class router, your home
# network). Never on a broker that is reachable from the internet.

listener 1883
allow_anonymous true

# Retained messages are kept in memory only: a broker restart forgets them.
persistence false

# Print every connect and disconnect (and with -v every packet).
connection_messages true
log_type all
