; Lesson 20 - Lab 1: AHT10 node on the class MQTT broker
; Board: ESP32-C3 Super Mini. Copy include/secrets.example.h to
; include/secrets.h first. secrets.h is never committed.

[env:c3]
platform = platformio/espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    adafruit/Adafruit AHTX0
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
