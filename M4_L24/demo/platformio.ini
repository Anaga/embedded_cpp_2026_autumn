; Lesson 24 demo - from parts to a device, ESP32-C3 Super Mini
; Arduino-ESP32 core 2.x.
;
; Two versions of the same device in one project:
;   before - every part glued into loop() as it worked alone: it waits
;   after  - one class per part, loop() is a list, WiFi + bot in a task
;
;   pio run -e before -t upload
;   pio run -e after  -t upload        (the default)
;
; In VS Code: pick the environment in the status bar (env:before / env:after).
;
; Both versions read the WiFi networks saved in NVS. Flash "after" first,
; type  wifi add "<ssid>" <password>  in the monitor, then "before" finds
; the same networks - NVS survives re-flashing.
;
; Before the first build: copy include/secrets.example.h to
; include/secrets.h and put your bot token in. secrets.h is never committed.
;
; "platformio/espressif32" (with the owner) is on purpose: if pioarduino
; (core 3.x) is also installed, plain "espressif32" may resolve to it.
; ArduinoJson is pinned to 6.x for UniversalTelegramBot (see lesson 23).

[platformio]
default_envs = after

[env]
platform = platformio/espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    adafruit/Adafruit AHTX0
    witnessmenow/UniversalTelegramBot@^1.3.0
    bblanchon/ArduinoJson@^6.21.5

[env:before]
build_src_filter = +<common/> +<before/>

[env:after]
build_src_filter = +<common/> +<after/>
