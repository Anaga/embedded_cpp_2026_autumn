; Lesson 12 demo - USB <-> UART bridge
; Raspberry Pi Pico (RP2040), Arduino-Pico core

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

monitor_speed = 115200
; Show what you type in the monitor.
monitor_echo = yes
; Send the whole line when you press Enter, not every key on its own.
; Lines end with CR LF (monitor_eol default).
monitor_filters = send_on_enter
