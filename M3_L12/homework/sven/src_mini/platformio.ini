; Override the root environment used by `pio run -e pico`.
[env:pico]
platform = espressif32
board = lolin_c3_mini
framework = arduino
board_build.core = esp32
monitor_speed = 115200

; The Super Mini has no USB-UART bridge. Serial runs over native USB CDC,
; so these two flags must be present or the monitor stays empty.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
