; Lesson 21 - CAN bus through TWAI (ESP32-C3 Super Mini + TJA1050)
;
; One firmware, four environments. Pick the env that matches your station:
;   pio run -e node1 -t upload      (or node2)
;   pio run -e selftest -t upload   (one board, no bus: TWAI_MODE_NO_ACK)
; Do not edit NODE_ID in the source - it comes from the env below.

[env]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:node1]
build_flags = ${env.build_flags} -D NODE_ID=1

[env:node2]
build_flags = ${env.build_flags} -D NODE_ID=2

; Self-test: the controller does not require an ACK, so a single board with
; one transceiver (or no transceiver at all, TX wired to RX) hears its own
; frames. Useful at home. Never use NO_ACK on the shared bus.
[env:selftest]
build_flags = ${env.build_flags} -D NODE_ID=1 -D CAN_SELFTEST=1
