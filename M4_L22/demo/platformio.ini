; Lesson 22 demo - one picture, three chips
; One source file, three boards. The only board-specific value is the data
; pin, and it lives here, in the env, not in the code.
;
; Build all:     pio run
; Upload one:    pio run -e c3 -t upload
;                pio run -e pico -t upload
;                pio run -e pico2 -t upload

[platformio]
default_envs = c3, pico, pico2

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

[env:c3]
platform = platformio/espressif32
board = lolin_c3_mini
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D LED_DATA_PIN=0

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
build_flags =
    -D LED_DATA_PIN=22

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
board_build.core = earlephilhower
build_flags =
    -D LED_DATA_PIN=0
