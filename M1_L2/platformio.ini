; Lesson 02 - First Firmware
; ESP32-C3 Super Mini, Arduino framework, PlatformIO
;
; Default build: src/main.cpp (instructor demo).
; To build the homework instead, uncomment the src_dir line below.

[platformio]
; src_dir = homework/src

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
